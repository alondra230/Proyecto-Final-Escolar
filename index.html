<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Inteligente de Gestión Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Sistema Inteligente de Gestión Escolar</h1>

    <div class="contenedor">

        <label>Nombre:</label>
        <input type="text" id="nombre">

        <label>Edad:</label>
        <input type="number" id="edad">

        <label>Grado:</label>
        <input type="text" id="grado">

        <label>Curso:</label>
        <input type="text" id="curso">

        <label>Notas (separadas por comas):</label>
        <input type="text" id="notas">

        <button onclick="registrarEstudiante()">
            Registrar Estudiante
        </button>

    </div>

    <div id="resultado"></div>

    <script src="script.js"></script>

</body>
</html>
<label>Dirección:</label>
<input type="text" id="direccion">

<label>Teléfono:</label>
<input type="text" id="telefono">

<label>Correo Electrónico:</label>
<input type="email" id="correo">
<label>Grado:</label>
<select id="grado">
    <option>Primero Básico</option>
    <option>Segundo Básico</option>
    <option>Tercero Básico</option>
</select>

<label>Curso:</label>
<select id="curso">
    <option>Matemática</option>
    <option>Programación</option>
    <option>Contabilidad</option>
</select>
